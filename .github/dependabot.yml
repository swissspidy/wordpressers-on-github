version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # Everything here is tooling, so bumps travel together in one pull
      # request (including coupled major bumps like vitest and @vitest/*).
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint does not yet support TypeScript 7.0.
      - dependency-name: typescript
        versions:
          - '>= 7.0.0'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - '*'
